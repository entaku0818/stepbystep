name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'ios/**'
      - '.swiftlint.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.swiftlint.yml'
      - '.github/workflows/ci.yml'

jobs:
  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:0.57.0
    steps:
      - uses: actions/checkout@v4
      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging
